name: Automated Financial Data Pipeline

on:
  schedule:
    - cron: '0 8 * * *' # Runs every day at 8:00 AM UTC
  workflow_dispatch:     # Allows you to trigger it manually anytime with a click!

permissions:
  contents: write        # Grants the action permission to commit files back to repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data fetch script
        run: python fetch_financial_data.py

      - name: Commit and push updated data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add Incoming_Data/
          git diff-index --quiet HEAD || (git commit -m "Auto-update financial data snapshot [skip ci]" && git push)